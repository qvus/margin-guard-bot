name: CI & Security Gate

on:
  push:
    branches: ["main", "master", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint & security rules (Ruff)
        run: ruff check src tests

      - name: Strict static type check (Mypy)
        run: mypy src

      - name: SAST security scan (Bandit)
        run: bandit -r src -ll -ii || bandit -r src

      - name: Test suite & coverage gate
        run: pytest --cov=margin_guard --cov-report=term-missing --cov-fail-under=90
