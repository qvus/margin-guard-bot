[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "margin-guard-bot"
version = "0.1.0"
description = "Telegram bot for monitoring Wildberries seller margins"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "cryptography>=43.0",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
